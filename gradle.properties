org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

# KSP 2.2.10-2.0.2 registers its generated sources through the kotlin.sourceSets DSL,
# which built-in Kotlin (AGP 9 default) otherwise rejects. This is AGP's own
# documented escape hatch for that incompatibility. Drop it once KSP registers
# generated sources via the variant API.
android.disallowKotlinSourceSets=false

kotlin.code.style=official
